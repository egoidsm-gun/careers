<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="{{og}}">
<meta property="og:url" content="{{canonical}}">
<link rel="canonical" href="{{canonical}}"><!-- 정식 주소는 egoidsm.com — github.io 사본이 따로 색인되지 않게 -->
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{root}}assets/img/favicon.png" sizes="180x180">
<link rel="apple-touch-icon" href="{{root}}assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="{{root}}assets/site.css?v={{v}}">
</head>
<body class="{{bodyclass}}">
<a class="skip" href="#main">본문으로 건너뛰기</a>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="logo" href="{{home}}" aria-label="egoidsm 채용 홈"><img src="{{root}}assets/img/logo.svg" alt="egoidsm"></a>
    <i class="brk" aria-hidden="true"></i>
    <ul class="menu">{{nav}}</ul>
    <div class="nav-right">
      <a class="nav-cta" href="{{ats}}" target="_blank" rel="noopener">RECRUITING</a>
    </div>
  </div>
</header>

<main id="main" data-editkey="{{editkey}}" data-root="{{root}}">
{{content}}
</main>

<footer class="foot">
  <div class="wrap">
    <div class="f1">
      <img src="{{root}}assets/img/logo.svg" alt="egoidsm" class="flogo">
      <p>브랜드의 강력한 자아를 만드는 창조자<br><span class="disp">Lifestyle goods brand builder</span></p>
      <!-- 대표 서명 크레딧(2026-09-18) — 편집 대상 아님 -->
      <div class="sig" data-noedit>
        <span data-noedit>created by</span>
        <img src="{{root}}assets/img/sign.png" alt="gun" class="sign" width="360" height="211" loading="lazy" decoding="async">
      </div>
    </div>
    <div class="f3">
      <span>© 2026 주식회사 에고이즘</span>
      <span>사업자등록번호 270-86-03084</span>
      <span>서울특별시 성동구 성수동2가 275-16 제일빌딩 7F</span>
      <a href="mailto:admin@egoidsm.com">admin@egoidsm.com</a>
      <a href="{{root}}privacy/">개인정보처리방침</a>
    </div>
  </div>
</footer>
<script src="{{root}}assets/site.js?v={{v}}" defer></script>
</body>
</html>
