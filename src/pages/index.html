<!-- 출항 아이덴트 v5 "보물을 찾는 개척선": 밤바다에 개척선(니냐호 사진 컷아웃, 돛에 로고)이 오른쪽에서 항해해 옴 → 길잡이 별이 반짝임 → 수평선에 황금빛(보물)이 떠오르며 배가 그 빛을 받음 → 빛이 터지며 배가 빛 속으로 사라지고 별 워프(home.js) → 메인 화면. 전부 CSS 키프레임(JS 없어도 걷힘).
     사이트 안에서 홈으로 돌아올 때(같은 출처 referrer, 새로고침 아님)만 짧은 버전, #edit는 생략 -->
<div class="ident" aria-hidden="true" data-noedit><i class="ident-bg"></i><i class="ident-sea"></i><i class="ident-guide"></i><i class="ident-gold"></i><div class="ident-ship"><i class="ship-glow"></i><img class="ship-img" src="{{root}}assets/img/ship-nina.webp" alt=""><img class="ship-logo" src="{{root}}assets/img/logo.png" alt=""></div><i class="ident-sparks"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i><i class="ident-flash"></i></div>
<script>try{var h=document.documentElement;if(location.hash==='#edit'){h.classList.add('ident-off')}else{var nv=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];var reload=nv&&nv.type==='reload';var same=document.referrer&&document.referrer.indexOf(location.origin)===0;if(same&&!reload)h.classList.add('ident-seen')}}catch(e){}</script>
<canvas id="stars" aria-hidden="true"></canvas>

<section class="screen hero">
  <div class="wrap">
    <p class="eyebrow">ONLY AT EGOIDSM</p>
    <h1 class="giant">미지의 영역을<br>개척하는<br>브랜드 창조자</h1>
  </div>
  <div class="scrollhint">SCROLL</div>
</section>

<section class="pin ship">
  <div class="pin-in">
    <div class="shipimg" style="background-image:url({{root}}assets/img/hero.jpg)"></div>
    <div class="wrap">
      <p class="eyebrow">THE PIONEER SHIP</p>
      <p class="giant words">미지의 항로를<br>앞장서 여는 배.</p>
      <p class="giant words">우리는 이 배를<br>개척선이라 부릅니다.</p>
    </div>
  </div>
</section>

<section class="screen center final">
  <div class="wrap">
    <p class="eyebrow">ALL ABOARD</p>
    <h2 class="giant">빠르게 승선하세요.</h2>
    <p class="lead">에고이즘은 항상 지금이 저점입니다.</p>
    <div class="btns"><a class="btn" href="{{root}}recruiting/">채용 중인 포지션 보기</a></div>
  </div>
</section>
<script src="{{root}}assets/home.js?v={{v}}" defer></script>
