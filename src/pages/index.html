<!-- {"path":"","title":"에고이즘 채용 | 미지의 영역을 개척하는 브랜드 창조자","desc":"라이프스타일 소비재 브랜드 빌더, 에고이즘. 굴뚝강아지·미뇽맨션·바쏠·휴그·퓌라·페이버스의 자아를 함께 실현할 크루를 찾습니다.","section":"home","bodyclass":"home"} -->
<!-- 출항 아이덴트 v8 "빛의 수평선"(넷플릭스 잡스 인트로 벤치마킹): 그린 것 없이 GPU 셰이더(home.js aurora)가 빛을 실시간 렌더한다.
     암전 → 백열 빛점 → 수평선으로 늘어남 → 한 박자 조여진 뒤 1.42s에 갈라져 퍼짐(플래시·색수차·별 워프) → 가라앉아 수평선의 잔광이 되어 히어로 배경으로 계속 살아 있음 → 2.9s 거대 글자.
     v8부터 다중 패스: 장면(빛의 세기, HDR) → 블룸 밉체인 → 합성(색 램프·비네트·필름 그레인·디더) — 카메라로 찍은 빛처럼. 진단 스위치 ?at=초 ?post=0 ?hdr=0 ?stars=0
     워드마크 장면(.mark, 사용자 요청): 로고 PNG를 ego → id → sm 세 조각으로 서로 떨어진 자리에 0.3/0.58/0.86s에 백열로 켜 오렌지로 식히고, 1.26→1.6s에 미끄러져 붙으며 붙는 순간 플래시(--tf). 하얗게 타올라 2.6s까지 흩어진다. 세 단어(자아·본능·~주의)의 결합임을 말 없이 보여주는 장면. 스크롤하면 빛 전체가 화면 1/3 안에 사라진다
     상단 바는 처음부터 보인다. 사이트 안에서 홈으로 돌아올 때(같은 출처 referrer, 새로고침 아님)는 잔광 상태에서 바로 시작, #edit는 정지 화면.
     새로고침·새 진입은 브라우저의 스크롤 복원을 끄고 맨 위에서 연다 — 중간 위치로 복원되면 인트로가 화면 밖에서 재생돼 아무것도 안 보인다(사용자 지시 2026-09-18).
     뒤로가기(back_forward)와 앵커(#해시)는 건드리지 않는다 — 그때는 보던 자리로 돌아가는 게 맞다 -->
<script>try{var h=document.documentElement;if(location.hash==='#edit'){h.classList.add('ident-off')}else{var nv=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];var reload=nv&&nv.type==='reload';var back=nv&&nv.type==='back_forward';if(!location.hash&&'scrollRestoration' in history)history.scrollRestoration=back?'auto':'manual';var same=document.referrer&&document.referrer.indexOf(location.origin)===0;if(same&&!reload)h.classList.add('ident-seen');
/* 인트로가 도는 동안 화면을 붙잡는다(2026-09-19 사용자 지시 "로딩중일 땐 로딩 화면만, 뷰가 고정") — 조금만 내려가도 빛이 amb 감쇠로 꺼져 로딩이 반쯤 지나간 채로 보인다.
   푸는 시각 = 새 진입 4s / 사이트 안 복귀 .6s. 4.7s(글자가 다 자리 잡는 때)는 답답해서 --t0(3.1s)까지 줄였다가, 사용자가 4s로 다시 올렸다(2026-09-19). 복귀는 인트로가 .5s로 짧아 그대로.
   뒤로가기·앵커 진입은 보던 자리로 가는 게 맞으니 잠그지 않는다 */
var mo=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!back&&!location.hash&&!mo){h.classList.add('intro-lock');
/* overflow:hidden만으로는 프로그래밍 스크롤(앵커 점프·복원·스크립트)이 그대로 통과한다 — 실측 확인.
   그래서 제스처는 preventDefault로 막고, 어떤 경로로든 밀려난 위치는 scroll에서 0으로 되돌린다 */
var hold=function(){if(window.pageYOffset)window.scrollTo(0,0)},stop=function(e){e.preventDefault()},
key=function(e){if(' PageDown PageUp ArrowDown ArrowUp End Home'.split(' ').indexOf(e.key)>=0)e.preventDefault()},
unlock=function(){h.classList.remove('intro-lock');removeEventListener('scroll',hold);removeEventListener('wheel',stop);removeEventListener('touchmove',stop);removeEventListener('keydown',key)};
addEventListener('scroll',hold,{passive:true});addEventListener('wheel',stop,{passive:false});addEventListener('touchmove',stop,{passive:false});addEventListener('keydown',key);
setTimeout(unlock,h.classList.contains('ident-seen')?600:4000);
/* 인트로 도중에 다른 페이지로 갔다가 뒤로 오면 잠긴 DOM이 bfcache에서 그대로 복원되는데 타이머는 다시 돌지 않는다 — 그대로 두면 영구 잠금 */
addEventListener('pageshow',function(e){if(e.persisted)unlock()})}}}catch(e){}</script>
