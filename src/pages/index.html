<!-- {"path":"","title":"에고이즘 채용 | 미지의 영역을 개척하는 브랜드 창조자","desc":"라이프스타일 소비재 브랜드 빌더, 에고이즘. 굴뚝강아지·미뇽맨션·바쏠·휴그·퓌라·페이버스의 자아를 함께 실현할 크루를 찾습니다.","section":"home","bodyclass":"home"} -->
<!-- 출항 아이덴트 v7 "빛의 수평선"(넷플릭스 잡스 인트로 벤치마킹): 그린 것 없이 GPU 셰이더(home.js aurora)가 빛을 실시간 렌더한다.
     암전 → 백열 빛점 → 수평선으로 늘어남 → 수십 개의 빛줄기로 갈라져 퍼짐(플래시·별 워프) → 가라앉아 수평선의 잔광이 되어 히어로 배경으로 계속 살아 있음 → 거대 글자.
     상단 바는 처음부터 보인다. 사이트 안에서 홈으로 돌아올 때(같은 출처 referrer, 새로고침 아님)는 잔광 상태에서 바로 시작, #edit는 정지 화면 -->
<script>try{var h=document.documentElement;if(location.hash==='#edit'){h.classList.add('ident-off')}else{var nv=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];var reload=nv&&nv.type==='reload';var same=document.referrer&&document.referrer.indexOf(location.origin)===0;if(same&&!reload)h.classList.add('ident-seen')}}catch(e){}</script>
<canvas id="aurora" aria-hidden="true"></canvas>
<canvas id="stars" aria-hidden="true"></canvas>

  </div>

</section>

    </div>
  </div>
</section>

  </div>
</section>
